<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Примерочная причёсок</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <h1>Примерочная причёсок</h1>
  <p class="subtitle">Авто-подгонка по лицу + реалистичное смешение слоёв</p>
</header>

<main>
  <section class="stage-wrap">
    <div id="stage" class="stage">
      <img id="photo" alt="" crossorigin="anonymous" />
      <div id="hairLayer" class="hair-layer" hidden>
        <div id="hairBase" class="hair-render hair-base"></div>
        <div id="hairShadow" class="hair-render hair-shadow"></div>
        <div id="hairLight" class="hair-render hair-light"></div>
        <div id="hairHandle" class="hair-handle"></div>
      </div>
      <div id="status" class="status"></div>
      <div id="placeholder" class="placeholder">
        <span>📷</span><p>Загрузите фото лица анфас</p>
      </div>
    </div>

    <div class="stage-tools">
      <label class="btn">
        <input type="file" id="fileInput" accept="image/*" hidden />
        Загрузить фото
      </label>
      <button id="autoFitBtn" class="btn" type="button">Авто-подгонка</button>
      <button id="resetBtn" class="btn btn-ghost" type="button">Сбросить</button>
      <button id="downloadBtn" class="btn btn-primary" type="button">Скачать</button>
    </div>
  </section>

  <aside class="sidebar">
    <h2>Причёски</h2>
    <div id="styles" class="styles-grid"></div>

    <h2>Настройки</h2>
    <div class="controls">
      <label>Размер<input type="range" id="scale" min="20" max="220" value="100" /></label>
      <label>Поворот<input type="range" id="rotate" min="-45" max="45" value="0" /></label>
      <label>Сдвиг по X<input type="range" id="offsetX" min="-200" max="200" value="0" /></label>
      <label>Сдвиг по Y<input type="range" id="offsetY" min="-200" max="200" value="0" /></label>
      <label>Цвет волос<input type="color" id="color" value="#3a2418" /></label>
      <label>Прозрачность<input type="range" id="opacity" min="30" max="100" value="100" /></label>
      <label>Сила теней<input type="range" id="shadowAmt" min="0" max="100" value="55" /></label>
      <label>Сила бликов<input type="range" id="lightAmt" min="0" max="100" value="45" /></label>
      <label>Шум краёв<input type="range" id="grainAmt" min="0" max="100" value="40" /></label>
    </div>

    <p class="hint">Подгонка срабатывает автоматически после загрузки фото. Поправить можно ползунками или перетаскиванием.</p>
  </aside>
</main>

<footer><small>Работает целиком в браузере — фото не покидает устройство.</small></footer>

<!-- SVG-фильтры для компоузинга (живут вне причёсок, чтобы переиспользовать) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="hair-grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="hair-grain-soft" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>
</svg>

<script src="hairstyles.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
